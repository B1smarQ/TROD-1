name: CI/CD

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  APP_DIR: app
  DOCKER_IMAGE_LOCAL: todo-nest-backend

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build application
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

  test:
    name: test+coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Run tests with coverage threshold
        working-directory: ${{ env.APP_DIR }}
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ env.APP_DIR }}/coverage
          if-no-files-found: ignore

  docker_build:
    name: docker_build
    runs-on: ubuntu-latest
    needs:
      - build
      - lint
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull --tag "${DOCKER_IMAGE_LOCAL}:${GITHUB_SHA::7}" ./app

  docker_push:
    name: docker_push
    runs-on: ubuntu-latest
    environment: CI
    needs:
      - docker_build
    if: github.event_name == 'push'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "::error title=Missing Docker Hub username::Set DOCKERHUB_USERNAME as a repository secret or repository variable. If it is an environment secret, add the matching environment to the docker_push job."
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error title=Missing Docker Hub token::Set DOCKERHUB_TOKEN as a repository secret. If it is an environment secret, add the matching environment to the docker_push job."
            exit 1
          fi
          if [[ "${DOCKERHUB_USERNAME}" == *$'\r'* || "${DOCKERHUB_USERNAME}" == *$'\n'* || "${DOCKERHUB_USERNAME}" == *' '* ]]; then
            echo "::error title=Malformed Docker Hub username::DOCKERHUB_USERNAME must be only your Docker Hub username, with no spaces, quotes, registry URL, or extra lines."
            exit 1
          fi
          if [[ "${DOCKERHUB_TOKEN}" == *$'\r'* || "${DOCKERHUB_TOKEN}" == *$'\n'* ]]; then
            echo "::error title=Malformed Docker Hub token::DOCKERHUB_TOKEN contains a line break. Paste only the raw Docker Hub access token value."
            exit 1
          fi
          if [[ "${DOCKERHUB_TOKEN}" == "Bearer "* || "${DOCKERHUB_TOKEN}" == "Basic "* ]]; then
            echo "::error title=Malformed Docker Hub token::DOCKERHUB_TOKEN should be the raw Docker Hub access token, not an Authorization header."
            exit 1
          fi
          if [[ "${DOCKERHUB_TOKEN}" == \"* || "${DOCKERHUB_TOKEN}" == \'* ]]; then
            echo "::error title=Malformed Docker Hub token::DOCKERHUB_TOKEN appears to include quote characters. Paste only the token value."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/todo-nest-backend"
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build --pull --tag "${IMAGE}:${SHORT_SHA}" --tag "${IMAGE}:${GITHUB_REF_NAME}" ./app
          docker push "${IMAGE}:${SHORT_SHA}"
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
