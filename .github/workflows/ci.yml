name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  APP_DIR: app
  DOCKER_IMAGE_LOCAL: todo-nest-backend

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build application
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

  test:
    name: test+coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Run tests with coverage threshold
        working-directory: ${{ env.APP_DIR }}
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ env.APP_DIR }}/coverage
          if-no-files-found: ignore

  docker_build:
    name: docker_build
    runs-on: ubuntu-latest
    needs:
      - build
      - lint
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull --tag "${DOCKER_IMAGE_LOCAL}:${GITHUB_SHA::7}" ./app

  docker_push:
    name: docker_push
    runs-on: ubuntu-latest
    needs:
      - docker_build
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/todo-nest-backend"
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build --pull --tag "${IMAGE}:${SHORT_SHA}" --tag "${IMAGE}:${GITHUB_REF_NAME}" ./app
          docker push "${IMAGE}:${SHORT_SHA}"
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
